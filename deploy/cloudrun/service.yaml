apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lex-ai-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:asia-south1:lex-pgvector
    spec:
      containerConcurrency: 80
      timeoutSeconds: 120
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/lex/lex-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: LEX_ENVIRONMENT
              value: production
            - name: LEX_GEMMA_MODEL
              value: gemma-4-31b-it
            - name: LEX_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lex-gemini-api-key
                  key: latest
            - name: LEX_DEVICE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: lex-device-token-secret
                  key: latest
            - name: LEX_ADMIN_API_KEY_HASH
              valueFrom:
                secretKeyRef:
                  name: lex-admin-api-key-hash
                  key: latest
            - name: LEX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lex-postgres-dsn
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
