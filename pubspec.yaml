name: lex_copilot
description: "Lex — Offline-capable AI legal copilot for India."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.7.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_edge_ai: ^2.7.2
  flutter_edge_ai_litertlm: ^1.21.3
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  google_mlkit_document_scanner: ^0.7.2
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  sqlite3: ^3.9.2
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  xml: ^7.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  go_router_builder: ^4.5.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/corpus/
    - assets/corpus/packs/
    - assets/ai/prompts/
    - assets/ai/schemas/
